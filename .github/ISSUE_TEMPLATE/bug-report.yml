name: Bug report
description: Something broken that isn't a bad commit message
labels: ['bug']
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: gitmsg version
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
    validations:
      required: true
